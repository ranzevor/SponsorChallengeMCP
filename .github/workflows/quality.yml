name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-office:
    name: protocol-and-office
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test protocol and office tools
        run: |
          python -m pip install -e ".[test]"
          python -m pytest tests/test_protocol.py tests/test_qwenwork.py

  provider-contracts:
    name: provider-contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test provider contracts and HTTP boundaries
        run: |
          python -m pip install -e ".[test]"
          python -m pytest tests/test_providers.py tests/test_http_boundaries.py tests/test_vivix_contract.py tests/test_minimax_audio_limits.py

  distribution-install:
    name: distribution-install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Build with minimum supported backend
        run: |
          python -m pip install "setuptools==77.0.3" wheel build
          python -m build --no-isolation --wheel --sdist
      - name: Verify installed services
        run: |
          python -m venv "$RUNNER_TEMP/wheel-install"
          "$RUNNER_TEMP/wheel-install/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-install/bin/sponsor-mcp" --help
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-install/bin/python" - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          command = str(Path(sys.executable).parent / "sponsor-mcp")

          for provider, count in {"stepfun": 1, "minimax": 2, "qwenwork": 3, "vivix": 5}.items():
              messages = [
                  {"jsonrpc": "2.0", "id": 1, "method": "initialize",
                   "params": {"protocolVersion": "2025-06-18",
                              "capabilities": {}, "clientInfo": {"name": "ci", "version": "1"}}},
                  {"jsonrpc": "2.0", "method": "notifications/initialized"},
                  {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
              ]
              process = subprocess.run(
                  [command, provider],
                  input="".join(json.dumps(message) + "\n" for message in messages),
                  text=True, capture_output=True, timeout=15, check=True,
              )
              replies = [json.loads(line) for line in process.stdout.splitlines()]
              assert [reply["id"] for reply in replies] == [1, 2], replies
              assert replies[0]["result"]["serverInfo"]["name"] == f"sponsor-{provider}-mcp"
              tools = replies[1]["result"]["tools"]
              assert len(tools) == count and all(tool["name"].startswith(provider + "_") for tool in tools)
              print(f"{provider}: initialized, discovered {len(tools)} tools")
          PY
